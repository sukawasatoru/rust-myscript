[package]
name = "mcp-pplx"
version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
keyring-core = "=1.0.1"
rpassword = "=7.5.5"
reqwest = { workspace = true }
rmcp = { workspace = true, features = ["schemars", "transport-io", "server", "client"] }
rust-myscript = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
db-keystore = "=0.6.0"
directories = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
