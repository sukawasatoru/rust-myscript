[package]
name = "rust-myscript"
version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true

[features]
default = []
# Helpers used only by crates excluded from the workspace.
legacy = ["dep:serde", "dep:toml"]
otel = [
    "dep:hostname",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-appender-tracing",
    "dep:opentelemetry-semantic-conventions",
    "dep:reqwest-otel",
    "dep:tracing-subscriber",
    "dep:url",
]
sqlite = ["dep:rusqlite"]

[dependencies]
anyhow = { workspace = true }
hostname = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-appender-tracing = { workspace = true, optional = true }
opentelemetry-semantic-conventions = { workspace = true, optional = true }
# Enables the transport features used by opentelemetry-otlp's default HTTP client.
reqwest-otel = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
url = { workspace = true, optional = true }
