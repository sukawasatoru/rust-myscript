[workspace]
resolver = "3"
members = [
    "crates/*",
]
exclude = [
    "crates/async-vs",
    "crates/checkghossversion",
    "crates/digest-auth",
    "crates/iijmio-cli",
    "crates/lfs-agent-local",
    "crates/mz-conv",
    "crates/netgear-finder",
    "crates/openai-cli",
    "crates/update-letsencrypt-cloudflare",
    "crates/wimaxtraffic"
]

[workspace.package]
version = "0.1.0"
description = "Super good command-line tools for myself"
authors = ["Satoru Sukawa <sukawasatoru.github@outlook.jp>"]
homepage = "https://github.com/sukawasatoru/rust-myscript"
repository = "https://github.com/sukawasatoru/rust-myscript.git"
license = "Apache-2.0"
edition = "2024"

[workspace.dependencies]
rust-myscript = { path = "crates/rust-myscript", default-features = false }
anyhow = "=1.0.104"
async-stream = "=0.3.6"
axum = { version = "=0.8.9", features = ["macros"] }
base64 = "=0.23.1"
blake2 = "=0.11.0"
blake3 = { version = "1.8.7" }
bytes = "=1.12.1"
chrono = { version = "=0.4.45", features = ["serde"] }
clap = { version = "=4.6.7", features = ["derive", "env"] }
clap_complete = "=4.6.11"
digest = "=0.11.3"
directories = "=6.0.0"
dotenv = "=0.15.0"
encoding_rs = "=0.8.44"
futures = "=0.3.34"
git2 = { version = "=0.21.0", default-features = false, features = ["vendored-libgit2"] }
hostname = "=0.4.2"
hmac = "=0.13.0"
indicatif = "=0.18.6"
infer = "=0.22.0"
libc = "=0.2.191"
md-5 = "=0.11.0"
mdns-sd = "=0.21.7"
mime = "=0.3.18"
num_cpus = "=1.17.0"
opener = "=0.9.0"
opentelemetry = { version = "=0.33.1", default-features = false }
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["logs"] }
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = ["http-proto", "logs", "reqwest-blocking-client"] }
opentelemetry-appender-tracing = { version = "=0.33.1", default-features = false }
opentelemetry-semantic-conventions = { version = "=0.33.1", features = ["semconv_experimental"] }
rand = "=0.10.3"
ratatui = "=0.30.2"
regex = "=1.13.1"
reqwest = { version = "=0.13.5", features = ["blocking", "json", "form", "brotli", "gzip", "deflate"] }
# OTLP uses protobuf bytes; retain TLS, HTTP/2 and system proxies without payload/decoding features.
# Keep the version aligned with reqwest above; both names resolve to the same package.
reqwest-otel = { package = "reqwest", version = "=0.13.5", default-features = false, features = ["blocking", "rustls", "http2", "system-proxy"] }
rmcp = { version = "3.9.0", features = ["schemars", "transport-io", "client"] }
# rusqlite requires SQLite >= 3.45.3. Windows uses the bundled library.
# Ubuntu: sudo apt install pkg-config libsqlite3-dev
# Check the system version: pkg-config --modversion sqlite3
rusqlite = { version = "=0.42.0", features = ["bundled-windows"] }
semver = { version = "=1.0.28", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.154"
sha1 = "=0.11.0"
sha2 = "=0.11.1"
sha3 = "=0.12.0"
serde_urlencoded = "=0.7.1"
strum = { version = "=0.28.0", features = ["derive"] }
tempfile = "=3.27.0"
tinytable-rs = { git = "https://github.com/sukawasatoru/tinytable-rs.git", tag = "v0.3.2" }
tokio = { version = "=1.54.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
toml = "=1.2.1"
tracing = "=0.1.44"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
tree_magic_mini = "=3.2.2"
trust-dns-resolver = "=0.23.2"
url = { version = "=2.5.8", features = ["serde"] }
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.3"
uuid = { version = "=1.29.2", features = ["v4"] }
walkdir = "2.5.0"
windows-registry = "=0.100.0"
windows-result = "=0.100.0"
axum-server = { version = "=0.9.2", features = ["tls-rustls"] }
tower-http = { version = "=0.7.1", features = ["fs"] }
zip = "9.5.1"
mockall = "=0.15.0"
